[package]
name = "audio-desktop"
version = "0.1.0"
edition = "2021"
default-run = "audio-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audio-runtime-paths = { path = "../../../crates/audio-runtime-paths" }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

# Windows-only: System Media Transport Controls (SMTC). Non-Windows builds get
# no-op stubs in src/smtc.rs; MPRIS is a later increment (no dbus deps here).
[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
